<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>404 | Page Not Found</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
rel="stylesheet">

<link rel="stylesheet" href="error.css">

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:'Poppins',sans-serif;

background:#071226;

overflow:hidden;

position:relative;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

}

.error-bg{

position:absolute;

inset:0;

background:url("blockchain-bg.webp") center/cover no-repeat;

opacity:.18;

}

.error-overlay{

position:absolute;

inset:0;

background:linear-gradient(135deg,#071226,#101B45,#1A0D4D);

}

.error-section{

position:relative;

z-index:2;

width:100%;

padding:20px;

}

.error-card{

position:relative;

padding:70px 50px;

border-radius:30px;

text-align:center;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

overflow:hidden;

}

.error-card h1{

font-size:150px;

font-weight:800;

background:linear-gradient(90deg,#7B2FF7,#D56EFF);

-webkit-background-clip:text;
background-clip:text;

color:transparent;

line-height:1;

}

.error-card h2{

color:#fff;

font-size:42px;

font-weight:700;

margin:20px 0;

}

.error-card p{

color:#C8D2F0;

font-size:18px;

line-height:1.8;

max-width:650px;

margin:auto;

}

.button-group{

margin-top:40px;

display:flex;

justify-content:center;

gap:20px;

flex-wrap:wrap;

}

.error-btn{

background:linear-gradient(90deg,#7B2FF7,#D56EFF);

color:#fff;

padding:15px 40px;

border-radius:50px;

}

.home-btn{

border:1px solid rgba(255,255,255,.2);

color:#fff;

padding:15px 40px;

border-radius:50px;

}

.error-btn:hover{

transform:translateY(-5px);

color:#fff;

}

.home-btn:hover{

background:#fff;

color:#111;

}

.floating-icon{

position:absolute;

font-size:42px;

color:#D56EFF;

opacity:.25;

animation:float 5s ease-in-out infinite;

}

.icon1{

top:40px;

left:60px;

}

.icon2{

right:70px;

top:80px;

animation-delay:1s;

}

.icon3{

bottom:60px;

left:50%;

animation-delay:2s;

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-15px);

}

}

@media(max-width:768px){

.error-card{

padding:50px 25px;

}

.error-card h1{

font-size:90px;

}

.error-card h2{

font-size:30px;

}

.error-card p{

font-size:16px;

}

.button-group{

flex-direction:column;

}

.error-btn,

.home-btn{

width:100%;

}

}

@media(max-width:576px){

.error-card h1{

font-size:72px;

}

.error-card h2{

font-size:24px;

}

}
</style>

</head>

<body>

<div class="error-bg"></div>

<div class="error-overlay"></div>

<section class="error-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-xl-7 col-lg-8">

<div class="error-card">

<div class="floating-icon icon1">

<i class="fa-brands fa-bitcoin"></i>

</div>

<div class="floating-icon icon2">

<i class="fa-brands fa-ethereum"></i>

</div>

<div class="floating-icon icon3">

<i class="fa-solid fa-cube"></i>

</div>

<h1>

404

</h1>

<h2>

Oops! Page Not Found

</h2>

<p>

The page you're looking for doesn't exist, has been moved,
or is temporarily unavailable.

</p>

<div class="button-group">

<button
class="btn error-btn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

Go Back

</button>

<a href="index.html"
class="btn home-btn">

<i class="fa-solid fa-house"></i>

Back To Home

</a>

</div>

</div>

</div>

</div>

</div>

</section>

</body>

</html>
