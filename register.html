<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blockchain Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-bg"></div>

    <div class="overlay"></div>

  

    <a href="index.html" class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

        Back To Home

    </a>

    <!-- Signup -->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5 col-md-8 col-sm-10">

                    <div class="login-card">

                        <div class="text-center mb-4">

                            <h5>BLOCKCHAIN</h5>

                            <h2>Create Account</h2>

                            <p>

                                Join our Blockchain platform and start your journey.

                            </p>

                        </div>

                        <form action="error.html">

                          

                            <div class="mb-3">

                                <label class="form-label">

                                    Username

                                </label>

                                <div class="input-box">

                                    <i class="fa-solid fa-user"></i>

                                    <input

                                        type="text"

                                        class="form-control"

                                        placeholder="Enter Username"

                                        required>

                                </div>

                            </div>

                        

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <div class="input-box">

                                    <i class="fa-solid fa-envelope"></i>

                                    <input

                                        type="email"

                                        class="form-control"

                                        placeholder="Enter Email"

                                        required>

                                </div>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="input-box">

                                    <i class="fa-solid fa-lock"></i>

                                    <input

                                        type="password"

                                        id="password"

                                        class="form-control"

                                        placeholder="Enter Password"

                                        required>

                                    <span class="toggle-password">

                                        <i id="eye1" class="fa-solid fa-eye"></i>

                                    </span>

                                </div>

                            </div>

                       

                            <div class="mb-3">

                                <label class="form-label">

                                    Confirm Password

                                </label>

                                <div class="input-box">

                                    <i class="fa-solid fa-lock"></i>

                                    <input

                                        type="password"

                                        id="confirmPassword"

                                        class="form-control"

                                        placeholder="Confirm Password"

                                        required>

                                    <span class="toggle-confirm">

                                        <i id="eye2" class="fa-solid fa-eye"></i>

                                    </span>

                                </div>

                            </div>

                       
                            <div class="form-check mb-4">

                                <input

                                    class="form-check-input"

                                    type="checkbox"

                                    required>

                                <label class="form-check-label">

                                    I agree to the

                                    <a href="error.html">

                                        Terms & Conditions

                                    </a>

                                </label>

                            </div>


                            <button

                                type="submit"

                                class="login-btn">

                                Create Account

                                <i class="fa-solid fa-user-plus ms-2"></i>

                            </button>

                            <div class="divider">

                                <span>

                                    OR

                                </span>

                            </div>

                            <div class="signup-link">

                                Already have an account?

                                <a href="login.html">

                                    Login

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script>
    

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

document.querySelector(".toggle-password").addEventListener("click", () => {

    if(password.type==="password"){

        password.type="text";

        eye1.classList.replace("fa-eye","fa-eye-slash");

    }else{

        password.type="password";

        eye1.classList.replace("fa-eye-slash","fa-eye");

    }

});

document.querySelector(".toggle-confirm").addEventListener("click",()=>{

    if(confirmPassword.type==="password"){

        confirmPassword.type="text";

        eye2.classList.replace("fa-eye","fa-eye-slash");

    }else{

        confirmPassword.type="password";

        eye2.classList.replace("fa-eye-slash","fa-eye");

    }

});
    </script>

</body>

</html>
